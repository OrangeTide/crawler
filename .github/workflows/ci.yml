name: CI

on:
  push:
    branches: [main, expanded-edition]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'content/**'
      - 'crawler.lpr'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'content/**'
      - 'crawler.lpr'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fpc

      - name: Install FPC (macOS)
        if: runner.os == 'macOS'
        run: brew install fpc

      - name: Install FPC and make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install lazarus make -y --no-progress

      - name: Put FPC on PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          fpcexe=$(find /c/tools/lazarus /c/lazarus -iname fpc.exe -path '*bin*' 2>/dev/null | head -n1)
          if [ -z "$fpcexe" ]; then echo "fpc.exe not found under the Lazarus install"; exit 1; fi
          echo "Found FPC at: $fpcexe"
          cygpath -w "$(dirname "$fpcexe")" >> "$GITHUB_PATH"

      - name: Compiler version
        run: fpc -iV

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: crawler-${{ matrix.name }}
          path: |
            build/crawler
            build/crawler.exe
            build/game.pak
          if-no-files-found: ignore
          retention-days: 14
