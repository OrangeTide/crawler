# Full Linux, Windows, and macOS matrix, run on a GitHub mirror. GitLab,
# where the repository also lives, runs a Linux-only build and test from
# .gitlab-ci.yml. Keep the two in step when the build or test command changes.
name: CI

on:
  push:
    branches: [main, expanded-edition]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'content/**'
      - 'crawler.lpr'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'content/**'
      - 'crawler.lpr'
      - 'Makefile'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-fpc

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: crawler-${{ matrix.name }}
          path: |
            build/crawler
            build/crawler.exe
            build/game.pak
          if-no-files-found: ignore
          retention-days: 14
